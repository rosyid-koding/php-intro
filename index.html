<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How PHP Works</title>
<style>
:root{--bg:#fff;--fg:#14213d;--mut:#5b6478;--acc:#2457f5;--hi:#ffe27a;--card:#f1f4fb;--bd:#cfd6e6;--ok:#0f7a55;--bad:#c9302c;--k:#9d2fb5;--s:#b4410b;--f:#8a6200;--v:#1b5fb5;--c:#4d7a3a}
:root[data-theme=dark]{--bg:#10162b;--fg:#f2f5ff;--mut:#9ba6c4;--acc:#6f95ff;--hi:#5c4a00;--card:#1a2240;--bd:#35406a;--ok:#4fdca8;--bad:#ff8a80;--k:#e08bff;--s:#ffb086;--f:#ffd866;--v:#7fc4ff;--c:#8fd18f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:clamp(17px,1.6vw,26px)/1.5 "Segoe UI",system-ui,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
button,input,select{font:inherit}
button{cursor:pointer;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:.45em 1.1em;font-weight:600}
button:hover{filter:brightness(1.12)}button:disabled{opacity:.45;cursor:default}
button.alt{background:var(--card);color:var(--fg);border:2px solid var(--bd)}
input,select{background:var(--bg);color:var(--fg);border:2px solid var(--bd);border-radius:8px;padding:.25em .5em}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#pbar{height:6px;background:var(--card);flex:none}#pfill{height:100%;background:var(--acc);width:0;transition:width .4s}
header,footer{display:flex;align-items:center;gap:10px;padding:8px 4vw;flex:none;color:var(--mut);font-size:.8em}
header b{color:var(--fg);margin-right:auto}
header button{padding:.2em .7em}
#view{flex:1;overflow:auto;padding:2vh 6vw;width:100%;max-width:1300px;margin:0 auto;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateX(24px)}}
footer{justify-content:center;gap:14px;border-top:2px solid var(--card)}
#dots{display:flex;gap:8px}#dots button{width:16px;height:16px;padding:0;border-radius:50%;background:var(--bd)}#dots button.on{background:var(--acc);transform:scale(1.35)}#dots button.seen{background:var(--ok)}
h1{font-size:2em;margin:.1em 0 .3em;line-height:1.15}p{margin:.4em 0;max-width:42em}
code,pre,.mono{font-family:Consolas,Menlo,"Courier New",monospace}
pre{margin:.6em 0;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:.6em 0;overflow-x:auto;font-size:.9em;white-space:pre}
pre div{padding:.05em 1em;border-left:6px solid transparent}pre div.hl{background:var(--hi);border-left-color:var(--acc)}
.k{color:var(--k)}.s{color:var(--s)}.f{color:var(--f)}.v{color:var(--v)}.c{color:var(--c)}.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}
.cur{display:inline-block;width:.5em;height:1em;background:var(--fg);vertical-align:middle;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.box{border:2px solid var(--bd);background:var(--card);border-radius:14px;padding:.7em 1em;margin:.6em 0}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:.6em 0}.col{flex:1;min-width:260px}
#track{position:relative;display:flex;justify-content:space-between;margin:2.2em 0 1em}
.node{width:30%;text-align:center;border:4px solid var(--bd);background:var(--card);border-radius:16px;padding:.7em .2em;font-weight:700;transition:.3s}
.node big{display:block;font-size:2.4em}.node.on{border-color:var(--acc);box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 25%,transparent);transform:scale(1.05)}
.node.spin big{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#pk{position:absolute;top:-1.4em;left:15%;font-size:2em;transform:translateX(-50%);transition:left .9s ease-in-out}
#cap{font-size:1.15em;font-weight:600;min-height:2.6em;border-color:var(--acc)}
.led{width:1em;height:1em;border-radius:50%;background:var(--bad);transition:.3s;flex:none}.led.up{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.svc{display:flex;gap:12px;align-items:center;margin:.4em 0}.svc b{width:5em}.svc span.mut{width:9em}
.prev{background:#fff;color:#111;font-family:Arial,sans-serif;padding:.6em 1em;border-radius:8px;border:2px solid var(--bd)}
.con{background:#0d1117;color:#7ee2a8;font-family:Consolas,Menlo,monospace;font-size:.85em;border-radius:12px;padding:.5em 1em;min-height:4.5em;max-height:9em;overflow:auto;margin-top:.6em}
.opt{display:block;width:100%;text-align:left;margin:.4em 0;background:var(--card);color:var(--fg);border:3px solid var(--bd)}
.opt.sel{border-color:var(--acc)}.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}.opt.wrong{border-color:var(--bad);animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hint{font-size:.7em;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="pbar"><div id="pfill"></div></div>
<header><b>&#9889; How PHP Works</b><span id="cnt"></span><button class="alt" onclick="theme()" title="Theme (T)">Theme</button><button class="alt" onclick="fsc()" title="Full screen (F)">Full screen</button></header>
<div id="view"></div>
<footer><button class="alt" id="bk" onclick="go(i-1)">&larr; Back</button><div id="dots"></div><button id="nx" onclick="go(i+1)">Next &rarr;</button><span class="hint">Keys: arrows, Space, T, F</span></footer>

<script>
const $=id=>document.getElementById(id),esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const code=l=>'<pre>'+l.map(x=>'<div>'+x+'</div>').join('')+'</pre>';
const term=(m,c='')=>{const o=$('out');if(o){o.insertAdjacentHTML('beforeend','<div class="'+c+'">'+m+'</div>');o.scrollTop=1e9}};
const day=new Date().toLocaleDateString('en-US',{weekday:'long'});
let timers=[],i=0,seen=new Set(),rest=false,sv={},fs=0,pt=0;const later=(f,t)=>timers.push(setTimeout(f,t));
function theme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark'}
function fsc(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
const CON='<div class="con" id="out"></div>';

const S=[
['Welcome',()=>{later(()=>{const t=['<span class="c">// What happens when you open a website?</span>','<span class="k">const</span> <span class="v">you</span> = <span class="s">"curious"</span>;','<span class="f">learn</span>(<span class="s">"PHP"</span>);'];let n=0;(function g(){if(!$('ty')||n>=t.length)return;$('ty').insertAdjacentHTML('beforeend','<div>'+t[n++]+'</div>');later(g,800)})()},300);
 return '<h1>What happens when you open a website?</h1><p>Your browser asks a <b>server</b> for the page. Today you will see how <b>PHP</b> works on that server.</p><pre id="ty"></pre><p>Use the <b>Next</b> button or the arrow keys to move through the lessons.</p><button onclick="go(1)">Start</button> <span class="cur"></span>'}],
['The journey of a request',()=>{later(()=>flow(0),50);
 return '<h1>The journey of a request</h1><div id="track"><div id="pk">&#128232;</div><div class="node" id="n0"><big>&#128187;</big>Browser</div><div class="node" id="n1"><big>&#128421;</big>Server (Apache)</div><div class="node" id="n2"><big>&#9881;</big>PHP</div></div><div class="row"><button onclick="play()" id="pl">Play</button><button class="alt" onclick="flow(fs+1)">Step</button><button class="alt" onclick="flow(0)">Reset</button></div><div class="box" id="cap"></div>'+code(['<span class="k">&lt;h1&gt;</span>Hello!<span class="k">&lt;/h1&gt;</span>','<span class="k">&lt;p&gt;</span>Today is <span class="k">&lt;?php</span> <span class="f">echo</span> <span class="f">date</span>(<span class="s">"l"</span>); <span class="k">?&gt;</span><span class="k">&lt;/p&gt;</span>'])+'<div id="res"></div>'}],
['HTML vs PHP',()=>'<h1>HTML vs PHP</h1><div class="row"><button class="alt" onclick="rest=!rest;sw()">Switch: tech words / restaurant words</button></div><div class="row"><div class="col box"><h1>HTML</h1><p class="bad" style="font-size:1.6em">&#128196; &rarr; &#128187;</p><p data-t="A plain file. It goes straight to the browser. Same for everyone." data-r="A pre-made meal on the shelf. Grab it. Same every time."></p></div><div class="col box"><h1>PHP</h1><p class="ok" style="font-size:1.6em">&#128196; &rarr; &#9881; &rarr; &#128187;</p><p data-t="The server runs the code first, then sends the HTML result. It can change for each person." data-r="Cooked to order in the kitchen. The meal depends on who orders and when."></p></div></div><div class="box"><b>Where it runs:</b> <span data-t="HTML runs in the browser. PHP runs on the server." data-r="You eat at the table. The cooking happens in the kitchen."></span></div>'],
['What the browser sees',()=>{later(demo,50);
 return '<h1>What does the browser see?</h1><div class="row"><label>Name <input id="dn" value="Budi" maxlength="14" size="10"></label><label>Time <select id="dt"><option>morning</option><option>afternoon</option><option>evening</option></select></label><button onclick="run()">&#9654; Run</button></div><div class="row"><div class="col"><b class="mut">PHP code (stays on the server)</b><div id="dc"></div></div><div class="col"><b class="mut">HTML the browser gets</b><div id="dr" class="mut">Press Run...</div></div></div><p class="hint">This page uses JavaScript to pretend to be PHP. Real PHP runs on a server like XAMPP.</p>'}],
['Why XAMPP?',()=>{sv={};
 return '<h1>Why do we need XAMPP?</h1><p>Your computer has no "kitchen" for PHP. XAMPP adds one. Start each service:</p><div class="box">'+[['a','Apache','web server'],['p','PHP','runs your code'],['m','MySQL','stores data']].map(x=>'<div class="svc"><span class="led" id="l'+x[0]+'"></span><b>'+x[1]+'</b><span class="mut">'+x[2]+'</span><button class="alt" onclick="svc(\''+x[0]+'\')">Start</button></div>').join('')+'</div><div class="row"><button onclick="tst(0)">Double-click the file (file://)</button><button onclick="tst(1)">Open http://localhost/hello.php</button></div><div id="tr" class="box mut">Pick a test.</div>'}],
['PHP basics',()=>'<h1>PHP playground</h1><div class="row"><div class="col box"><b>Variables</b>'+code(['<span class="v">$name</span> = <span class="s">"<span id="c1">Budi</span>"</span>;','<span class="f">echo</span> <span class="s">"Hello, $name!"</span>;'])+'<input id="i1" value="Budi" maxlength="14" size="8" oninput="c1.textContent=this.value"> <button onclick="lines([\'Hello, \'+(i1.value||\'friend\')+\'!\'])">Run</button></div><div class="col box"><b>If / else</b>'+code(['<span class="v">$hour</span> = <span id="c2">9</span>;','<span class="k">if</span> (<span class="v">$hour</span> &lt; 12) {','  <span class="f">echo</span> <span class="s">"Good morning"</span>;','} <span class="k">else</span> { <span class="f">echo</span> <span class="s">"Good afternoon"</span>; }'])+'<input id="i2" type="range" min="0" max="23" value="9" oninput="c2.textContent=this.value"> <button onclick="lines([+i2.value<12?\'Good morning\':\'Good afternoon\'])">Run</button></div><div class="col box"><b>Loops</b>'+code(['<span class="k">for</span> (<span class="v">$i</span> = 1; <span class="v">$i</span> &lt;= <span id="c3">3</span>; <span class="v">$i</span>++) {','  <span class="f">echo</span> <span class="s">"Number $i"</span>;','}'])+'<input id="i3" type="number" min="1" max="8" value="3" style="width:4em" oninput="c3.textContent=Math.min(8,Math.max(1,this.value||1))"> <button onclick="b3()">Run</button></div></div>'+CON],
['Quiz',()=>{qi=0;qs=0;later(showQ,20);return '<h1>Quiz</h1><div id="q"></div>'}],
['Try it yourself',()=>'<h1>Try it yourself</h1><div class="box">'+['Install XAMPP and open the control panel.','Click Start next to Apache.','Save a file called hello.php in the htdocs folder.','Open http://localhost/hello.php in your browser.'].map(t=>'<label style="display:block;margin:.4em 0"><input type="checkbox" style="width:1em;height:1em"> '+t+'</label>').join('')+'</div>'+code(['<span class="k">&lt;?php</span> <span class="f">echo</span> <span class="s">"Hello, world!"</span>; <span class="k">?&gt;</span>'])+'<p><b>Tip:</b> the address must start with <span class="ok">http://localhost</span>. If it starts with <span class="bad">file://</span>, PHP will not run.</p>']
];
function go(n){if(n<0||n>=S.length)return;timers.forEach(clearTimeout);timers=[];clearInterval(pt);pt=0;i=n;fs=0;seen.add(n);
 const v=$('view');v.style.animation='none';v.offsetHeight;v.style.animation='';v.innerHTML=S[n][1]();v.scrollTop=0;sw();
 $('pfill').style.width=((n+1)/S.length*100)+'%';$('cnt').textContent=(n+1)+' / '+S.length+'  '+S[n][0];$('bk').disabled=n==0;$('nx').disabled=n==S.length-1;
 $('dots').innerHTML=S.map((s,k)=>'<button class="'+(k==n?'on':seen.has(k)?'seen':'')+'" title="'+s[0]+'" aria-label="'+s[0]+'" onclick="go('+k+')"></button>').join('')}
function sw(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=rest?e.dataset.r:e.dataset.t)}

const steps=[[0,'Step 1: You type localhost/hello.php. Your browser sends a request.'],[1,'Step 2: Apache gets the request. It sees ".php", so it asks PHP for help.'],[2,'Step 3: PHP runs the code. date("l") turns into today\'s name.'],[1,'Step 4: PHP hands plain HTML back to the server.'],[0,'Step 5: The browser shows the page. It never saw any PHP code!']];
function flow(n){if(n>=steps.length)n=0;fs=n;const s=steps[n];
 [0,1,2].forEach(k=>{$('n'+k).classList.toggle('on',k==s[0]);$('n'+k).classList.toggle('spin',k==2&&n==2)});
 $('pk').style.left=[15,50,85][s[0]]+'%';$('pk').innerHTML=n>=3?'&#128196;':'&#128232;';$('cap').textContent=s[1];
 document.querySelectorAll('pre div').forEach((x,k)=>x.classList.toggle('hl',n==2&&k==1));
 $('res').innerHTML=n>=3?'<div class="box">Browser receives: <span class="ok mono">&lt;p&gt;Today is '+day+'&lt;/p&gt;</span></div>':'';
 if(n==0&&pt){clearInterval(pt);pt=0;$('pl').textContent='Play'}}
function play(){if(pt){clearInterval(pt);pt=0;$('pl').textContent='Play';return}$('pl').textContent='Pause';pt=setInterval(()=>{if(fs==4){clearInterval(pt);pt=0;$('pl').textContent='Play';return}flow(fs+1)},2600)}

function demo(){if(!$('dn'))return;const n=esc($('dn').value||'friend'),t=$('dt').value;
 $('dc').innerHTML=code(['<span class="k">&lt;?php</span>','<span class="v">$name</span> = <span class="s">"'+n+'"</span>;','<span class="v">$time</span> = <span class="s">"'+t+'"</span>;','<span class="k">?&gt;</span>','<span class="k">&lt;h1&gt;</span>Good <span class="k">&lt;?=</span> <span class="v">$time</span> <span class="k">?&gt;</span>, <span class="k">&lt;?=</span> <span class="v">$name</span> <span class="k">?&gt;</span>!<span class="k">&lt;/h1&gt;</span>']);
 $('dn').oninput=$('dt').onchange=demo}
function run(){const r=$('dr');r.innerHTML='<span class="mut">&#9881; PHP is cooking...</span>';later(()=>{const n=esc($('dn').value||'friend'),t=$('dt').value;
 r.innerHTML=code(['<span class="k">&lt;h1&gt;</span>Good '+t+', '+n+'!<span class="k">&lt;/h1&gt;</span>'])+'<div class="prev"><h1 style="font-size:1.3em;margin:0">Good '+t+', '+n+'!</h1></div><p class="mut">No PHP in sight. Just HTML.</p>'},900)}

function svc(k){sv[k]=1;$('l'+k).classList.add('up')}
function tst(w){const r=$('tr');
 if(!w)r.innerHTML='<span class="mut">file://hello.php</span>'+code(['<span class="k">&lt;h1&gt;</span>Hello!<span class="k">&lt;/h1&gt;</span>','<span class="k">&lt;p&gt;</span>Today is <span class="k">&lt;?php</span> <span class="f">echo</span> <span class="f">date</span>(<span class="s">"l"</span>); <span class="k">?&gt;</span><span class="k">&lt;/p&gt;</span>'])+'<b class="bad">Fail: no server, so the browser shows the raw PHP code.</b>';
 else if(sv.a&&sv.p)r.innerHTML='<span class="mut">http://localhost/hello.php</span><div class="prev"><h1 style="font-size:1.3em;margin:0">Hello!</h1><p>Today is '+day+'</p></div><b class="ok">Works! Apache gave the file to PHP.</b>';
 else{r.innerHTML='<b class="bad">Can\'t connect. Start Apache and PHP first.</b>';r.style.animation='none';r.offsetHeight;r.style.animation='sh .4s'}}

function lines(a){a.forEach((t,k)=>later(()=>term('&gt; '+esc(t),''),k*450))}
function b3(){const n=Math.min(8,Math.max(1,+$('i3').value||1));lines(Array.from({length:n},(_,k)=>'Number '+(k+1)))}

const Q=[['What is a server?',['A computer that sends websites to browsers','A type of browser','A PHP file'],0,'A server stores websites and sends them when asked.'],['Where does PHP run?',['In the browser','On the server','In the monitor'],1,'The browser cannot run PHP.'],['What does the browser receive in the end?',['PHP code','Plain HTML','A database'],1,'PHP is turned into HTML first.'],['Why can\'t we just double-click a PHP file?',['Files are too big','Our computer needs a server with PHP, like XAMPP','The browser is broken'],1,'Without a server, nothing runs the PHP.'],['Which one can PHP do but HTML cannot?',['Show a heading','Save data to a database','Show an image'],1,'PHP can handle forms and databases.']];
let qi=0,qs=0,pick=-1,shown=false;
function showQ(){const e=$('q');if(!e)return;pick=-1;shown=false;
 if(qi>=Q.length){e.innerHTML='<div class="box"><h1>Score: '+qs+'/'+Q.length+'</h1><p>'+(qs>=4?'Great work! You understand how PHP works.':'Good try! Go back and review the lessons.')+'</p><button onclick="qi=0;qs=0;showQ()">Try again</button></div>';return}
 const q=Q[qi];e.innerHTML='<p class="mut">Question '+(qi+1)+' of '+Q.length+'. Ask the class, then press Show answer.</p><p><b>'+q[0]+'</b></p>'+q[1].map((o,k)=>'<button class="opt" onclick="pk_('+k+',this)">'+o+'</button>').join('')+'<div class="row"><button onclick="reveal()" id="rv">Show answer</button></div><p id="fb"></p>'}
function pk_(k,b){if(shown)return;pick=k;document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));b.classList.add('sel')}
function reveal(){if(shown){qi++;showQ();return}shown=true;const q=Q[qi],o=document.querySelectorAll('.opt');
 o.forEach((x,k)=>{x.classList.remove('sel');if(k==q[2])x.classList.add('right');else if(k==pick)x.classList.add('wrong')});
 if(pick==q[2])qs++;$('fb').innerHTML='<b class="ok">'+q[3]+'</b>';$('rv').textContent=qi==Q.length-1?'See score':'Next question'}

document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const k=e.key;
 if(k=='ArrowRight')go(i+1);else if(k=='ArrowLeft')go(i-1);
 else if(k==' '){e.preventDefault();if(i==1)flow(fs+1);else go(i+1)}
 else if(k=='t'||k=='T')theme();else if(k=='f'||k=='F')fsc()});
go(0);
</script>
</body>
</html>
